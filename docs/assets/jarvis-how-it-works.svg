<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="490" viewBox="0 0 1440 490" role="img" aria-labelledby="t d"><title id="t">Cómo se reparten Jarvis y los servicios externos</title><desc id="d">La interfaz, la activación, la síntesis de voz, los archivos y la memoria están en Windows. OpenAI Realtime entiende el audio durante la conversación activa. Claude Code y las APIs de datos son conexiones opcionales.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#60cbe4" stroke-width="1.5"/></marker></defs><rect width="1440" height="490" rx="14" fill="#030d15"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="50" fill="#c6f0fa" font-size="25">Una interfaz. Dos lugares de trabajo.</text><text x="44" y="80" fill="#799fb2" font-size="16">La voz se genera en tu PC. La conversación principal usa tu cuenta de OpenAI.</text><rect x="44" y="116" width="770" height="296" rx="8" fill="#06202c" stroke="#20617a"/><text x="68" y="150" fill="#7dd8ed" font-size="14" letter-spacing="2">EN TU PC · WINDOWS</text><rect x="68" y="176" width="718" height="66" rx="5" fill="#0a2f3e" stroke="#317b91"/><text x="88" y="203" fill="#d1f2fb" font-size="20">Interfaz de Jarvis + servicio local</text><text x="88" y="226" fill="#8cbacb" font-size="14">La esfera, los controles y las herramientas de la aplicación.</text><g fill="#03141f" stroke="#1f5970"><rect x="68" y="260" width="222" height="123" rx="5"/><rect x="307" y="260" width="222" height="123" rx="5"/><rect x="546" y="260" width="240" height="123" rx="5"/></g><g fill="#c0eaf5" font-size="19"><text x="84" y="290">Activación y voz</text><text x="323" y="290">Archivos y memoria</text><text x="562" y="290">Motor local opcional</text></g><g fill="#86adbf" font-size="15"><text x="84" y="321">Whisper small</text><text x="84" y="345">Qwen3-TTS · NVIDIA</text><text x="323" y="321">Documentos + SQLite</text><text x="323" y="345">Claves con Windows DPAPI</text><text x="562" y="321">Ollama · Qwen3 8B</text><text x="562" y="345">Para tareas compatibles</text></g><rect x="944" y="116" width="452" height="296" rx="8" fill="#061723" stroke="#294c66"/><text x="970" y="150" fill="#8ebad5" font-size="14" letter-spacing="2">SERVICIOS EXTERNOS</text><g fill="#c9eaf8" font-size="20"><text x="970" y="196">OpenAI Realtime</text><text x="970" y="272">Claude Code · opcional</text><text x="970" y="347">APIs de datos · a elección</text></g><g fill="#829fb4" font-size="15"><text x="970" y="222">Audio y conversación · cobro por uso</text><text x="970" y="298">Tareas delegadas · tu propia sesión</text><text x="970" y="373">Planes gratuitos, cuotas o cargos</text></g><g fill="none" stroke="#60cbe4" stroke-width="1.5" marker-end="url(#a)"><path d="M822 204H934" marker-start="url(#a)"/><path d="M822 281H934" marker-start="url(#a)"/><path d="M822 356H934" marker-start="url(#a)"/></g><text x="44" y="456" fill="#7197a9" font-size="15">La web necesita el compañero en esa PC. No controla tu equipo por sí sola.</text></g></svg>