<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="292" viewBox="0 0 1440 292" role="img" aria-labelledby="t d"><title id="t">Del instalador a tu primera conversación</title><desc id="d">Instalar Jarvis, descargar automáticamente componentes desde sus proveedores oficiales, cargar una clave propia y activar la escucha. Los modelos requieren descarga y espacio en la PC.</desc><rect width="1440" height="292" rx="14" fill="#030d15"/><g font-family="Segoe UI,Arial,sans-serif"><text x="1190" y="47" fill="#77bfd3" font-size="14">BETA · v0.1.4</text><text x="40" y="48" fill="#caeff9" font-size="25">Del instalador a tu primera conversación</text><rect x="40" y="78" width="310" height="150" rx="6" fill="#06212e" stroke="#24647c"/><text x="58" y="106" fill="#66c8e1" font-size="12" letter-spacing="2">01</text><text x="58" y="140" fill="#c9effa" font-size="22">Instalá Jarvis</text><text x="58" y="175" fill="#8bb1c4" font-size="16">Elegí una carpeta</text><text x="58" y="199" fill="#8bb1c4" font-size="16">en tu PC Windows.</text><path d="M360 153h20l-6-6m6 6l-6 6" fill="none" stroke="#62cce5" stroke-width="1.5"/><rect x="390" y="78" width="310" height="150" rx="6" fill="#06212e" stroke="#24647c"/><text x="408" y="106" fill="#66c8e1" font-size="12" letter-spacing="2">02</text><text x="408" y="140" fill="#c9effa" font-size="22">Descargas oficiales</text><text x="408" y="175" fill="#8bb1c4" font-size="16">Voz y activación desde HF.</text><text x="408" y="199" fill="#8bb1c4" font-size="16">Razonamiento: Ollama, opcional.</text><path d="M710 153h20l-6-6m6 6l-6 6" fill="none" stroke="#62cce5" stroke-width="1.5"/><rect x="740" y="78" width="310" height="150" rx="6" fill="#06212e" stroke="#24647c"/><text x="758" y="106" fill="#66c8e1" font-size="12" letter-spacing="2">03</text><text x="758" y="140" fill="#c9effa" font-size="22">Tu propia clave</text><text x="758" y="175" fill="#8bb1c4" font-size="16">Conectá tu cuenta OpenAI</text><text x="758" y="199" fill="#8bb1c4" font-size="16">desde el formulario.</text><path d="M1060 153h20l-6-6m6 6l-6 6" fill="none" stroke="#62cce5" stroke-width="1.5"/><rect x="1090" y="78" width="310" height="150" rx="6" fill="#06212e" stroke="#24647c"/><text x="1108" y="106" fill="#66c8e1" font-size="12" letter-spacing="2">04</text><text x="1108" y="140" fill="#c9effa" font-size="22">Activá la escucha</text><text x="1108" y="175" fill="#8bb1c4" font-size="16">Decí «Jarvis» o pulsá</text><text x="1108" y="199" fill="#8bb1c4" font-size="16">Iniciar voz.</text><text x="40" y="268" fill="#779eb0" font-size="15">Los modelos siguen necesitando descarga y espacio local. La API de conversación se paga por separado.</text></g></svg>