name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt openpyxl python-docx
      - name: Python contracts (no API key or microphone)
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: JavaScript contracts
        run: node --test desktop/test/*.test.cjs tests/*.mjs
